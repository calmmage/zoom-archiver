[project]
name = "zoom-archiver"
version = "0.1.0"
description = "Resumable Zoom cloud recording archives with byte verification and safe mirroring"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1"]

[project.scripts]
zoom-archiver = "zoom_archiver.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
